# ============================================================================
# EN DEHORS DU TRAVAIL (onglets de la section "Centres d'intérêt")
#   cartes      les encadrés de l'onglet ; mis_en_avant: true = bordure rouge
#   conclusion  la phrase en bas, "Dans le travail : ..."
# ============================================================================

onglets:
- id: sport
  nom: Sport
  resume: Handball, NBA, Formule 1
  titre: Discipline et esprit d'équipe
  cartes:
  - titre: Handball, National 1
    texte: 'De 2017 à 2019 en semi-professionnel : entraînement quotidien, un rôle précis au sein du collectif et une exigence de résultat.'
    mis_en_avant: true
  - titre: NBA
    texte: Je m'intéresse aux systèmes de jeu et à l'analyse statistique. Les individualités comptent, mais c'est le collectif qui gagne.
  - titre: Formule 1
    texte: Un arrêt au stand de deux secondes repose sur des centaines de répétitions et une équipe parfaitement coordonnée. C'est ainsi que je conçois un bon déploiement.
  conclusion: 'Dans le travail : respecter le plan, être fiable, et faire passer l''équipe avant soi.'
- id: jeux
  nom: Jeux vidéo
  resume: League of Legends, Diablo, World of Warcraft
  titre: Stratégie et optimisation
  cartes:
  - titre: League of Legends
    texte: Lire une situation, s'adapter vite, et analyser ses défaites pour comprendre ce qui n'a pas fonctionné.
  - titre: Diablo
    texte: 'L''optimisation patiente : chercher le réglage qui fait la différence, une démarche proche de l''amélioration continue d''un code.'
  - titre: World of Warcraft
    texte: Les raids demandent une stratégie préparée, des rôles clairs et beaucoup de coordination entre les joueurs.
  conclusion: 'Dans le travail : de la patience face aux tâches répétitives, et le goût de comprendre l''origine d''un problème.'
- id: lecture
  nom: Manga
  resume: Berserk, Tokyo Ghoul
  titre: Résilience
  cartes:
  - titre: Berserk
    texte: Une œuvre sombre, portée par un personnage qui continue d'avancer malgré l'adversité. Un thème qui fait écho à mon propre parcours.
  - titre: Tokyo Ghoul
    texte: Une esthétique marquante et une réflexion sur la dualité. Un peu à mon image, entre le terrain et l'écran, entre le développement et le réseau.
  conclusion: 'Dans le travail : quand un projet se complique, je reste mobilisé jusqu''à trouver une solution.'
