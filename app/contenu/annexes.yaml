# ============================================================================
# LES ANNEXES (page pages/annexes.html)
# ----------------------------------------------------------------------------
# Les documents à montrer au jury, rangés par réalisation.
# Un bloc par groupe ; dans chaque groupe, une ligne par document :
#   titre        le nom du document
#   texte        une phrase pour dire ce qu'il contient
#   type         l'étiquette à gauche (PDF, Page, Image, PowerPoint, Lien)
#   url          le fichier ou la page (depuis la racine du site)
# Les comptes rendus de TP (contenu/cours.yaml) et les documents personnels
# (contenu/documents.yaml) sont ajoutés tout seuls en bas de la page.
# Pour ajouter une annexe : déposer le fichier dans assets/annexes/, puis
# copier une ligne ci-dessous.
# ============================================================================

groupes:
- id: e5
  titre: Épreuve E5
  documents:
  - titre: Questions et réponses pour l'oral
    texte: "Parcours, les six compétences, veille, portfolio, notions générales et modifications en direct (51 questions)."
    type: PDF
    url: assets/annexes/questions/oral-e5.pdf
  - titre: Tableau de synthèse
    texte: Mes réalisations face aux six compétences du bloc 1.
    type: PDF
    url: assets/annexes/tableau-de-synthese.pdf

- id: portfolio
  titre: Le portfolio
  documents:
  - titre: Dossier technique du portfolio
    texte: "Toutes les fiches : user stories, choix techniques, architecture, extraits de code, tests, sécurité, mise en ligne."
    type: Page
    url: pages/dossier-portfolio.html
  - titre: User stories
    texte: "Le besoin du site : en tant que…, je veux…, afin de…, avec les critères d'acceptation."
    type: Page
    url: pages/dossier-portfolio.html#user-stories
  - titre: Choix techniques
    texte: Symfony, composants Twig, YAML, export statique, GitHub Pages, Tailwind, JavaScript, tests.
    type: Page
    url: pages/dossier-portfolio.html#choix-techniques
  - titre: Architecture et extraits de code
    texte: Contrôleur, service Contenu, commande d'export, fonction lien(), composants, recherche, JavaScript.
    type: Page
    url: pages/dossier-portfolio.html#architecture-code
  - titre: Modifier le site en direct
    texte: Quel fichier modifier pour chaque demande, puis exporter, tester et publier.
    type: Page
    url: pages/dossier-portfolio.html#modifications
  - titre: Guide des modifications (GitHub)
    texte: Les recettes pas à pas pour l'oral et les erreurs courantes.
    type: Lien
    url: https://github.com/dorianpachot-create/portefollio/blob/main/GUIDE-MODIFICATIONS.md
  - titre: Code source du portfolio (GitHub)
    texte: Le dépôt complet, avec le README et l'historique des modifications.
    type: Lien
    url: https://github.com/dorianpachot-create/portefollio

- id: gestion-cabinet
  titre: Application de gestion de cabinet
  documents:
  - titre: Questions et réponses pour l'oral
    texte: "131 questions : métier, besoin, architecture, base de données, 23 requêtes SQL prêtes, sécurité, Docker, tests, compétences."
    type: PDF
    url: assets/annexes/questions/gestion-cabinet.pdf
  - titre: Fiche descriptive de la réalisation
    texte: Cadre, compétences mobilisées, ressources et productions.
    type: PDF
    url: assets/annexes/fiches-e5/fiche-gestion-cabinet.pdf
  - titre: Cahier des charges
    texte: "Version 1 : contexte, problématique, tunnel de vente, rôles et fonctionnalités des deux applications."
    type: PDF
    url: assets/annexes/gestion-cabinet/cahier-des-charges.pdf
  - titre: Cahier technique
    texte: "Version 1 : architecture, choix justifiés, routes de l'API, base de données, sécurité, RGPD, tests."
    type: PDF
    url: assets/annexes/gestion-cabinet/cahier-technique.pdf
  - titre: MCD (modèle conceptuel de données)
    texte: Les 6 entités, les 7 associations et leurs cardinalités.
    type: PDF
    url: assets/annexes/gestion-cabinet/mcd.pdf
  - titre: MLD (modèle logique de données)
    texte: Les 6 relations et leurs 7 clés étrangères.
    type: PDF
    url: assets/annexes/gestion-cabinet/mld.pdf
  - titre: Schéma relationnel
    texte: Les 6 tables avec leurs colonnes, leurs types et leurs liens.
    type: PDF
    url: assets/annexes/gestion-cabinet/schema-relationnel.pdf
  - titre: Script SQL de la base
    texte: "Création des 6 tables, clés étrangères, contraintes CHECK et compte MySQL de l'API (MySQL 8)."
    type: SQL
    url: assets/annexes/gestion-cabinet/schema-bdd-courtage.sql
  - titre: Schéma d'architecture
    texte: "Les deux applications, l'API et la base, dans Docker Compose."
    type: Image
    url: assets/meta/shot-cabinet.jpg

