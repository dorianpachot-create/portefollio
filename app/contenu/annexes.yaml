  - id: pn-user-stories
    rubrique: Le besoin
    titre: 'Pla''Net : les user stories'
    mots_cles: user story récit utilisateur en tant que administrateur étudiant intervenant planning cours critère fait quand
    tableau:
      entetes:
      - En tant que…
      - je veux…
      - afin de…
      - Critère « Fait quand »
      lignes:
      - - administrateur
        - saisir une séance (classe, intervenant, salle, matière, horaire)
        - construire le planning
        - la séance apparaît dans le calendrier de la classe
      - - administrateur
        - créer un cours commun à plusieurs classes
        - ne pas recopier la séance
        - une séance avec 3 classes apparaît dans les 3 calendriers
      - - administrateur
        - être prévenu d'un conflit
        - éviter les erreurs de planning
        - une classe déjà en cours bloque l'enregistrement ; une salle déjà prise donne un avertissement
      - - administrateur
        - archiver une salle ou un intervenant
        - garder l'historique
        - l'élément disparaît des listes, les séances passées restent intactes
      - - étudiant ou intervenant
        - consulter le planning
        - savoir où et quand j'ai cours
        - le calendrier s'affiche sans droit de modification
  - id: pn-choix-bdd
    rubrique: Les choix techniques
    titre: 'Pla''Net : choix techniques et base de données'
    mots_cles: choix technique Symfony Doctrine Twig PHP MariaDB base de données colonne obsolete table de liaison seance_classe migration rejouable Trello carte décision IA
    tableau:
      entetes:
      - Choix
      - Pourquoi
      lignes:
      - - 2 jours et demi de conception sur 4
        - Figer le besoin et la base avant de coder, pour vérifier le code carte par carte
      - - 45 cartes Trello, priorités P1 à P4, critère « Fait quand »
        - Un avancement mesurable ; 34 cartes sur 45 réalisées
      - - Une carte DÉCISION bloquante
        - Trancher quatre questions de conception avant le code
      - - Colonne <code>obsolete</code> dans chaque table
        - 'Ne jamais rien supprimer : archiver sans casser les séances passées'
      - - Table de liaison <code>seance_classe</code>
        - Un cours commun = une seule séance liée à plusieurs classes
      - - Clés étrangères, fin après le début, index sur les dates
        - La base refuse les incohérences et reste rapide
      - - Migrations SQL rejouables
        - Faire évoluer la base en production sans doublon ni perte
      - - Symfony, Doctrine, Twig, MariaDB
        - Le cadre du projet ; code généré en grande partie par l'IA puis vérifié
