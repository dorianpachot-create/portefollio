# ============================================================================
# LES ANNEXES (page pages/annexes.html)
# ----------------------------------------------------------------------------
# Les documents à montrer au jury, rangés par réalisation.
# Un bloc par groupe ; dans chaque groupe, une ligne par document :
#   titre        le nom du document
#   texte        une phrase pour dire ce qu'il contient
#   type         l'étiquette à gauche (PDF, Page, Image, PowerPoint, Lien)
#   url          le fichier ou la page (depuis la racine du site)
#   Chaque groupe peut aussi avoir des fiches (user stories, choix techniques,
#   extraits de code), affichées sous ses documents et indexées dans la recherche :
#   id, rubrique, titre, mots_cles, puis paragraphes, tableau {entetes, lignes},
#   liste, code [{titre, fichier, langage, texte}] (tous facultatifs).
# Les comptes rendus de TP (contenu/cours.yaml) et les documents personnels
# (contenu/documents.yaml) sont ajoutés tout seuls en bas de la page.
# Pour ajouter une annexe : déposer le fichier dans assets/annexes/, puis
# copier une ligne ci-dessous.
# ============================================================================

groupes:
- id: e5
  titre: Épreuve E5
  documents:
  - titre: Questions et réponses pour l'oral
    texte: Parcours, les six compétences, veille, portfolio, notions générales et modifications en direct (51 questions).
    type: PDF
    url: assets/annexes/questions/oral-e5.pdf
  - titre: Tableau de synthèse
    texte: Mes réalisations face aux six compétences du bloc 1.
    type: PDF
    url: assets/annexes/tableau-de-synthese.pdf
- id: portfolio
  titre: Le portfolio
  documents:
  - titre: Guide des modifications (GitHub)
    texte: Les recettes pas à pas pour l'oral et les erreurs courantes.
    type: Lien
    url: https://github.com/dorianpachot-create/portefollio/blob/main/GUIDE-MODIFICATIONS.md
  - titre: Code source du portfolio (GitHub)
    texte: Le dépôt complet, avec le README et l'historique des modifications.
    type: Lien
    url: https://github.com/dorianpachot-create/portefollio
  fiches:
  - rubrique: Le projet
    id: objectifs
    titre: 'Portfolio : pourquoi ce site'
    mots_cles: objectif public cible jury recruteur alternance besoin
    paragraphes:
    - 'Le portfolio présente mon parcours de BTS SIO SLAM et mes réalisations au jury de l''épreuve E5 et aux entreprises qui recrutent en alternance. Il sert aussi de dossier : chaque projet a sa page, et les annexes regroupent les cahiers, fiches et comptes rendus.'
    - 'C''est aussi un projet à part entière : une application Symfony organisée en composants, dont les textes sont séparés du code, exportée en pages HTML statiques et publiée gratuitement sur GitHub Pages.'
    liste:
    - '<strong>Montrer</strong> : des réalisations concrètes, avec ce que j''ai fait moi-même, les difficultés et ce que j''en retiens.'
    - '<strong>Prouver</strong> : chaque affirmation renvoie à un document (cahier des charges, fiche E5, compte rendu, capture).'
    - '<strong>Être facile à faire évoluer</strong> : un texte se change dans un fichier YAML, sans toucher au HTML.'
    - '<strong>Coûter zéro et ne présenter aucune faille côté serveur</strong> : site statique, aucun PHP ne tourne en ligne.'
  - rubrique: Le projet
    id: user-stories
    titre: 'Portfolio : les user stories'
    mots_cles: user story récit utilisateur besoin critère d acceptation agile en tant que
    paragraphes:
    - 'Le besoin écrit sous forme de user stories : « En tant que…, je veux…, afin de… », avec un critère d''acceptation vérifiable et l''endroit où c''est réalisé.'
    tableau:
      entetes:
      - En tant que…
      - je veux…
      - afin de…
      - Critère d'acceptation
      - Réalisé par
      lignes:
      - - membre du jury
        - voir mes réalisations dès l'accueil
        - juger rapidement mon niveau
        - les projets sont à moins d'un défilement, chaque carte est cliquable
        - section Réalisations, cartes entièrement cliquables
      - - membre du jury
        - ouvrir la preuve de ce qui est affirmé
        - vérifier le travail
        - chaque projet a ses documents à un clic
        - boutons de chaque page projet, page Annexes
      - - membre du jury
        - retrouver un document ou un TP sans chercher
        - gagner du temps pendant l'oral
        - une recherche par mot donne le bon résultat
        - recherche Ctrl+K (accents et majuscules ignorés)
      - - recruteur
        - comprendre mon parcours en une minute
        - savoir si mon profil correspond
        - une frise résume les étapes
        - section Mon parcours (frise horizontale)
      - - recruteur
        - télécharger mon CV et me contacter
        - me proposer un entretien
        - CV en PDF et contact en un clic
        - section Mon dossier, section Contact, copie de l'adresse e-mail
      - - visiteur sur téléphone
        - lire le site confortablement
        - le consulter n'importe où
        - aucune page ne déborde en largeur
        - mise en page adaptative (Tailwind), menu mobile
      - - visiteur
        - lire en plein soleil ou dans une salle éclairée
        - voir correctement le contenu
        - un bouton passe en mode clair et s'en souvient
        - bouton soleil / lune, localStorage
      - - visiteur malvoyant ou au clavier
        - naviguer sans souris
        - accéder à tout le contenu
        - lien d'évitement, textes alternatifs, frise au clavier
        - accessibilité (voir la fiche)
      - - visiteur
        - jouer à Mission Orion sans rien installer
        - découvrir un projet personnel
        - le jeu se lance dans le navigateur
        - page Mini-jeu (WebAssembly)
      - - moi, le jour de l'oral
        - modifier un texte en direct
        - répondre à une demande du jury
        - un texte se change dans un seul fichier YAML
        - contenu/*.yaml et GUIDE-MODIFICATIONS.md
      - - moi, après une modification
        - savoir que je n'ai rien cassé
        - publier sans crainte
        - les tests passent avant le commit
        - tests/dom.test.js (42 tests, liens internes vérifiés)
  - rubrique: Le projet
    id: fonctionnalites
    titre: 'Portfolio : les pages et les fonctionnalités'
    mots_cles: pages fonctionnalités accueil projets TP stage annexes documents CV jeu recherche mode clair filtre frise
    liste:
    - '<strong>Accueil</strong> (une seule longue page) : présentation, parcours en frise, réalisations avec filtre Tous / Livrés / En cours, projets encadrés, outils, qualités, veille, dossier (CV, lettres), contact.'
    - '<strong>Une page par projet</strong> : SYNCRO, Pla''Net, CRP-Assurance, Mission Orion, Venzy, avec fiche, sommaire, sections et documents.'
    - '<strong>Projets encadrés</strong> : tous les TP des deux années, avec objectif, réalisation, ce que j''en retiens et compte rendu.'
    - <strong>Journal de stage</strong>, <strong>Annexes</strong> de l'E5, <strong>Documents</strong>, <strong>CV</strong>, <strong>Mini-jeu</strong>, <strong>Mentions légales</strong>. Les annexes contiennent aussi ces fiches techniques, rangées par projet.
    - <strong>Recherche</strong> (bouton du menu, Ctrl+K ou /), <strong>mode clair</strong>, barre de progression du défilement, menu mobile, sommaire qui suit la lecture.
  - rubrique: Le projet
    id: choix-techniques
    titre: 'Portfolio : les choix techniques'
    mots_cles: choix technique justification Symfony Twig YAML statique GitHub Pages Tailwind JavaScript jsdom pourquoi alternative
    tableau:
      entetes:
      - Besoin
      - Choix
      - Pourquoi
      - Écarté
      lignes:
      - - Organiser le code
        - Symfony 7.4
        - 'framework vu en cours, routes, contrôleur, services, commandes : une vraie structure d''application'
        - HTML écrit à la main (première version, trop répétitif)
      - - Ne pas répéter le HTML
        - Composants Twig (Symfony UX Twig Component)
        - une brique (bouton, carte, panneau) écrite une fois, réutilisée partout
        - copier-coller entre pages
      - - Changer un texte facilement
        - Fichiers YAML (app/contenu/)
        - les textes sont séparés de la mise en page ; lisibles sans connaître le HTML
        - base de données (inutile pour un site de cette taille)
      - - Héberger gratuitement et sans risque
        - Export en HTML statique + GitHub Pages
        - aucun PHP en ligne, donc aucune faille serveur ; HTTPS fourni ; publication par git push
        - hébergement PHP payant
      - - Mettre en page vite et de façon cohérente
        - Tailwind CSS (version navigateur) + css/site.css
        - classes utilitaires, thème de couleurs centralisé
        - framework CSS complet (Bootstrap)
      - - Interactions légères
        - JavaScript sans framework
        - quelques comportements seulement ; le site reste lisible sans JavaScript
        - React ou Vue (trop lourd pour le besoin)
      - - Vérifier les pages
        - Node.js + jsdom
        - tests automatiques sur les pages générées, dont les liens internes
        - vérification à la main
      - - Jouer au jeu Python dans le navigateur
        - pygbag (WebAssembly)
        - le jeu pygame tourne sans installation
        - vidéo du jeu
  - rubrique: Architecture et code
    id: architecture
    titre: L'architecture
    mots_cles: architecture schéma fonctionnement export statique dossier arborescence MVC
    paragraphes:
    - Les textes (YAML) et la mise en page (gabarits Twig) sont séparés. Le contrôleur Symfony lit les textes avec le service Contenu et les passe aux gabarits. La commande app:export calcule chaque page comme si un visiteur la demandait et enregistre le HTML à la racine du dépôt. GitHub Pages publie ces fichiers.
    - 'C''est le modèle MVC : les fichiers YAML jouent le rôle du modèle (les données), les gabarits Twig la vue, PageController le contrôleur.'
    code:
    - titre: Le chemin d'une page
      langage: texte
      texte: |-
        Fichier YAML (texte)  +  Gabarit Twig (mise en page)  +  Composants (briques)
                            \            |            /
                             PageController (Symfony)
                                       |
                          php bin/console app:export
                                       |
                       index.html, pages/*.html  ->  GitHub Pages
    - titre: Le dossier app/
      langage: texte
      texte: |-
        app/
        ├── bin/console                  Ligne de commande Symfony
        ├── public/index.php             Point d'entrée (serveur de développement)
        ├── config/                      Configuration (bundles, Twig, composants, services)
        ├── contenu/*.yaml               LES TEXTES DU SITE
        ├── src/
        │   ├── Controller/PageController.php   Une méthode par page
        │   ├── Service/Contenu.php             Lit les fichiers YAML (avec un cache)
        │   ├── Command/ExportCommand.php       La commande app:export
        │   ├── Twig/LienExtension.php          Fonction lien() : liens relatifs
        │   └── Twig/Components/EnTete.php      Composant avec classe (le menu)
        └── templates/
            ├── base.html.twig           Structure commune
            ├── accueil/                 L'accueil, un fichier par section
            ├── pages/                   Les pages secondaires
            └── components/              Les composants : <twig:Bouton>, <twig:Tag>...
  - rubrique: Architecture et code
    id: code-controleur
    titre: Le contrôleur et les routes
    mots_cles: contrôleur controller route attribut Route render slug priority PageController AbstractController
    paragraphes:
    - 'Une méthode = une page. L''attribut #[Route] donne l''adresse ; elle reprend exactement le nom du fichier exporté. La route des projets a un paramètre {slug} : une seule méthode sert les cinq pages projet. priority: -1 la fait passer après les autres routes de pages/, pour que /pages/stage.html ne soit pas pris pour un projet.'
    code:
    - titre: L'accueil
      fichier: app/src/Controller/PageController.php
      langage: php
      texte: |-
        #[Route('/', name: 'accueil_racine')]
        #[Route('/index.html', name: 'accueil')]
        public function accueil(): Response
        {
            return $this->render('accueil/index.html.twig', [
                'profil' => $this->contenu->get('profil'),
                'parcours' => $this->contenu->get('parcours')['etapes'],
                // ... les autres textes de l'accueil
            ]);
        }
    - titre: Une route, cinq pages projet
      fichier: app/src/Controller/PageController.php
      langage: php
      texte: |-
        #[Route('/pages/{slug}.html', name: 'projet', requirements: ['slug' => '[a-z0-9-]+'], priority: -1)]
        public function projet(string $slug): Response
        {
            return $this->render('pages/projet.html.twig', [
                'projet' => $this->contenu->projet($slug),
            ]);
        }
  - rubrique: Architecture et code
    id: code-service
    titre: Le service Contenu (lecture des YAML)
    mots_cles: service Contenu YAML cache injection dépendance get projet 404 NotFoundHttpException
    paragraphes:
    - Le service lit un fichier YAML et le garde en mémoire (cache) pour ne pas le relire. Il est injecté automatiquement dans le contrôleur par son constructeur (injection de dépendances). Un projet inconnu déclenche une erreur 404.
    code:
    - titre: Lire un fichier, avec un cache
      fichier: app/src/Service/Contenu.php
      langage: php
      texte: |-
        public function get(string $fichier): array
        {
            if (!isset($this->cache[$fichier])) {
                $chemin = $this->dossierContenu.'/'.$fichier.'.yaml';
                if (!is_file($chemin)) {
                    throw new \RuntimeException(sprintf('Fichier de contenu introuvable : %s', $chemin));
                }
                $this->cache[$fichier] = Yaml::parseFile($chemin);
            }

            return $this->cache[$fichier];
        }
    - titre: Retrouver un projet par son slug
      fichier: app/src/Service/Contenu.php
      langage: php
      texte: |-
        public function projet(string $slug): array
        {
            foreach ($this->projets() as $projet) {
                if ($projet['slug'] === $slug) {
                    return $projet;
                }
            }

            throw new NotFoundHttpException(sprintf('Aucun projet "%s" dans contenu/projets.yaml', $slug));
        }
  - rubrique: Architecture et code
    id: code-injection
    titre: La configuration et l'injection de dépendances
    mots_cles: services.yaml autowire autoconfigure bind paramètre injection dépendance configuration
    paragraphes:
    - 'autowire : Symfony fournit tout seul les objets demandés dans les constructeurs. bind : les paramètres $dossierContenu et $dossierExport reçoivent les chemins définis une seule fois. autoconfigure : la commande et l''extension Twig sont reconnues sans rien déclarer.'
    code:
    - titre: config/services.yaml
      fichier: app/config/services.yaml
      langage: yaml
      texte: |-
        parameters:
            # Dossier des fichiers de contenu (textes du site, au format YAML).
            app.dossier_contenu: '%kernel.project_dir%/contenu'
            # Dossier où l'export écrit les pages HTML : la racine du dépôt, servie par GitHub Pages.
            app.dossier_export: '%kernel.project_dir%/..'

        services:
            _defaults:
                autowire: true      # les dépendances sont injectées automatiquement
                autoconfigure: true # les commandes, extensions Twig, etc. sont reconnues automatiquement
                bind:
                    $dossierContenu: '%app.dossier_contenu%'
                    $dossierExport: '%app.dossier_export%'

            App\:
                resource: '../src/'
                exclude:
                    - '../src/Kernel.php'
  - rubrique: Architecture et code
    id: code-export
    titre: La commande d'export
    mots_cles: commande console app:export ExportCommand kernel handle Request statique GitHub Pages génération
    paragraphes:
    - 'GitHub Pages ne sait pas exécuter de PHP. La commande joue chaque requête dans Symfony, sans serveur web, et enregistre le HTML. La liste des adresses est déduite des routes : ajouter une route suffit pour qu''elle soit exportée ; la route {slug} donne une page par projet.'
    code:
    - titre: Calculer et enregistrer chaque page
      fichier: app/src/Command/ExportCommand.php
      langage: php
      texte: |-
        foreach ($this->adressesAExporter() as $adresse) {
            // On "joue" la requête dans Symfony, sans serveur web
            $reponse = $this->kernel->handle(Request::create($adresse), HttpKernelInterface::MAIN_REQUEST, false);

            if ($reponse->getStatusCode() !== 200) {
                $io->error(sprintf('%s : erreur %d', $adresse, $reponse->getStatusCode()));
                ++$erreurs;
                continue;
            }

            $fichier = $this->dossierExport.$adresse;
            if (!is_dir(dirname($fichier))) {
                mkdir(dirname($fichier), 0777, true);
            }
            file_put_contents($fichier, $reponse->getContent());
            $io->writeln(sprintf('  <info>ok</info>  %s', ltrim($adresse, '/')));
        }
    - titre: Les adresses viennent des routes
      fichier: app/src/Command/ExportCommand.php
      langage: php
      texte: |-
        foreach ($this->router->getRouteCollection() as $nom => $route) {
            $chemin = $route->getPath();
            if ($nom === 'accueil_racine' || str_starts_with($nom, '_')) {
                continue; // "/" est un doublon de /index.html ; les routes internes de Symfony sont ignorées
            }

            if (str_contains($chemin, '{slug}')) {
                // Route des projets : une page par projet de contenu/projets.yaml
                foreach ($this->contenu->projets() as $projet) {
                    $adresses[] = str_replace('{slug}', $projet['slug'], $chemin);
                }
                continue;
            }
            $adresses[] = $chemin;
        }
  - rubrique: Architecture et code
    id: code-lien
    titre: L'extension Twig lien()
    mots_cles: extension Twig fonction lien liens relatifs chemin LienExtension TwigFunction
    paragraphes:
    - 'Les pages sont des fichiers : les liens doivent être relatifs, et ils ne s''écrivent pas pareil depuis index.html et depuis pages/. On écrit toujours le chemin depuis la racine ; lien() le convertit. Les adresses externes et les ancres ne changent pas.'
    code:
    - titre: La conversion
      fichier: app/src/Twig/LienExtension.php
      langage: php
      texte: |-
        public function lien(string $cible): string
        {
            // Adresse externe ou ancre : rien à changer
            if (preg_match('~^(https?:|mailto:|tel:|#)~', $cible)) {
                return $cible;
            }

            if (!$this->estDansPages()) {
                return $cible;
            }

            // On est dans pages/ : une autre page du même dossier, ou on remonte d'un cran
            return str_starts_with($cible, 'pages/') ? substr($cible, strlen('pages/')) : '../'.$cible;
        }
    - titre: Utilisation dans un gabarit
      langage: twig
      texte: |-
        {{ lien('assets/cv/CV.pdf') }}
        {# depuis index.html    -> assets/cv/CV.pdf     #}
        {# depuis pages/cv.html -> ../assets/cv/CV.pdf  #}
  - rubrique: Architecture et code
    id: code-composants
    titre: Les composants Twig
    mots_cles: composant Twig component props twig:Bouton EnTete AsTwigComponent réutilisable brique
    paragraphes:
    - 'Un composant est une brique appelée comme une balise HTML. Ses paramètres sont déclarés par {% props %}. Le « : » devant un paramètre signifie « variable Twig » ; sans « : », c''est un texte. EnTete est un composant avec classe : la classe PHP prépare les liens du menu, le gabarit les affiche.'
    code:
    - titre: Appeler des composants
      langage: twig
      texte: |-
        <twig:Bouton texte="Me contacter" url="#contact" />
        <twig:ListeTags :tags="projet.technos" />
        <twig:Panneau id="contexte" titre="Le contexte">
          <p>Texte libre à l'intérieur.</p>
        </twig:Panneau>
    - titre: Le composant Bouton
      fichier: app/templates/components/Bouton.html.twig
      langage: twig
      texte: |-
        {% props texte, url = '#', style = 'principal', petit = false, icone = null, telecharger = null, masque = null %}
        {%- set externe = url starts with 'http' -%}
        <a class="btn {{ style == 'principal' ? 'btn-primary' : 'btn-ghost' }}{{ petit ? ' btn-sm' }}" {% if masque %}href="#" data-lien="{{ masque }}" rel="nofollow"{% else %}href="{{ lien(url) }}"{% endif %}
          {%- if externe and not masque %} target="_blank" rel="noopener noreferrer"{% elseif url ends with '.pdf' and not telecharger %} target="_blank" rel="noopener"{% endif %}
          {%- if telecharger %} download="{{ telecharger }}"{% endif %}>
          {%- if icone %}<twig:Icone :nom="icone" />{% endif %}{{ texte }}</a>
    - titre: 'Un composant avec classe : le menu'
      fichier: app/src/Twig/Components/EnTete.php
      langage: php
      texte: |-
        #[AsTwigComponent]
        class EnTete
        {
            /** true sur l'accueil : les liens pointent vers les sections de la page (#parcours...) */
            public bool $accueil = false;

            /** Texte du lien à mettre en surbrillance, ex. "Projets" */
            public string $actif = '';

            public function __construct(private Contenu $contenu)
            {
            }

            /**
             * Liens du menu principal (écran large).
             * Chaque lien : ['texte' => ..., 'cible' => ...]. La cible est écrite depuis
             * la racine du site ; le gabarit la passe dans lien() pour la rendre relative.
             */
            public function liens(): array
            {
                $profil = $this->contenu->get('profil');

                if ($this->accueil) {
                    return array_map(
                        fn (array $l) => ['texte' => $l['texte'], 'cible' => '#'.$l['ancre']],
                        $profil['menu_accueil']
                    );
                }

                return $profil['menu_pages'];
            }
        }
  - rubrique: Architecture et code
    id: code-yaml
    titre: Les textes en YAML et la boucle Twig
    mots_cles: YAML contenu texte boucle for Twig projets.yaml apostrophe indentation
    paragraphes:
    - 'Chaque projet est un bloc de projets.yaml. Le gabarit de l''accueil parcourt la liste avec une boucle for et choisit le bon composant. Ajouter un projet = ajouter un bloc YAML, sans toucher au code. Piège du YAML : dans un texte entre apostrophes, une apostrophe se double (l''''application).'
    code:
    - titre: Un projet dans app/contenu/projets.yaml (extrait)
      fichier: app/contenu/projets.yaml
      langage: yaml
      texte: |-
        - slug: venzy
          nom: Venzy
          couleur: '#F59E0B'
          titre_page: Venzy, application de suivi des ventes, projet en cours | Dorian Pachot
          description: "Venzy : deux applications Flutter (mobile pour les mandataires, bureau pour le gérant) et une API Node.js pour suivre les ventes, du prospect au contrat signé. Premier client : un cabinet de courtage en assurance. Projet de BTS en cours : cahiers et base de données terminés."
          cadre: Projet de deuxième année de BTS, en cours
    - titre: La boucle de la section Réalisations
      fichier: app/templates/accueil/_realisations.html.twig
      langage: twig
      texte: |-
        {% for projet in projets %}
          {% if projet.accueil.grande_carte ?? false %}
            <twig:GrandeCarteProjet :projet="projet" />
          {% else %}
            <twig:CarteProjetAccueil :projet="projet" />
          {% endif %}
        {% endfor %}
  - rubrique: Architecture et code
    id: code-base
    titre: Le gabarit de base et le mode clair
    mots_cles: base.html.twig héritage extends block mode clair thème localStorage data-theme couleurs
    paragraphes:
    - 'Chaque page hérite de base.html.twig ({% extends %}) et remplit ses blocs (titre, description, contenu, scripts). Le thème de couleurs est défini une seule fois. Le mode clair est remis avant l''affichage, pour éviter un flash sombre : le choix est gardé dans le localStorage du navigateur.'
    code:
    - titre: Une page qui hérite de la base
      fichier: app/templates/pages/cours.html.twig
      langage: twig
      texte: |-
        {% extends 'base.html.twig' %}

        {% block titre %}Projets encadrés de BTS SIO | Dorian Pachot{% endblock %}
        {% block chemin %}pages/projets-cours.html{% endblock %}
        {% block entete %}<twig:EnTete actif="Cours" />{% endblock %}

        {% block contenu %}
          ...
        {% endblock %}
    - titre: Les couleurs du site
      fichier: app/templates/base.html.twig
      langage: css
      texte: |-
        @theme {
          --color-void: #090A0F;
