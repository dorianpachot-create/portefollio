    tableau:
      entetes:
      - En tant que…
      - je veux…
      - afin de…
      - Critère d'acceptation
      lignes:
      - - visiteur particulier ou professionnel
        - trouver l'offre qui me correspond
        - savoir si le cabinet peut m'assurer
        - plus de trente pages d'offres, rangées par type
      - - visiteur
        - demander un devis en ligne
        - être recontacté
        - la demande arrive dans le back-office
      - - client
        - consulter mes contrats et devis
        - avoir mes documents sans appeler
        - espace client protégé, contrat téléchargeable en PDF
      - - gérant du cabinet
        - modifier textes, actualités, FAQ et partenaires
        - ne pas dépendre du développeur
        - tout se modifie depuis le back-office, sans renvoyer de fichiers
      - - gérant du cabinet
        - un site rapide et conforme
        - inspirer confiance
        - images de 226 Mo à 7 Mo, mentions légales et RGPD en place
  - id: crp-choix-techniques
    rubrique: Les choix techniques
    titre: 'CRP-Assurance : les choix techniques'
    mots_cles: choix technique PHP MySQL PDO requête préparée CSRF hébergement mutualisé LWS FTP FileZilla SSH compatibilité PHP 7.1 sécurité journal erreurs
    tableau:
      entetes:
      - Choix
      - Pourquoi
      lignes:
      - - PHP et MySQL sans framework, compatibles PHP 7.1 et plus
        - La version de PHP de l'hébergement mutualisé n'était pas garantie
      - - PDO et requêtes préparées
        - Protection contre l'injection SQL
      - - Jetons CSRF sur les formulaires d'administration
        - Empêcher un autre site d'envoyer un formulaire à la place de l'administrateur
      - - Identifiants dans un fichier séparé, hors du dépôt
        - Aucun secret dans le code
      - - Erreurs dans un journal protégé, jamais affichées
        - Ne rien révéler aux visiteurs
      - - Pages d'offres générées depuis un catalogue commun
        - Plus de trente pages sans tout recopier
      - - Mise en ligne FTP, page de vérification
        - 'Pas d''accès SSH : la page compare chaque fichier au paquet envoyé et teste la base et les droits'
