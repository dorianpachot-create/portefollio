  - id: sy-user-stories
    rubrique: Le besoin
    titre: 'SYNCRO : les user stories'
    mots_cles: user story récit utilisateur en tant que membre responsable équipe planning disponibilités critère d acceptation
    tableau:
      entetes:
      - En tant que…
      - je veux…
      - afin de…
      - Critère d'acceptation
      lignes:
      - - membre
        - saisir mes disponibilités de la semaine (matin, après-midi, autres plages)
        - que mon responsable sache quand je suis libre
        - la saisie est enregistrée et visible par le responsable du groupe
      - - membre
        - rejoindre un groupe en scannant un QR code
        - ne rien avoir à taper
        - le scan ouvre l'application et ajoute le membre au bon groupe
      - - membre
        - recevoir une notification
        - ne rien manquer
        - notification reçue sur Android et sur iPhone
      - - membre
        - supprimer mon compte depuis l'application
        - maîtriser mes données (exigence Apple)
        - le compte est supprimé ; un propriétaire de groupe doit d'abord le transmettre
      - - responsable
        - valider puis verrouiller la semaine
        - que le planning devienne la référence
        - après verrouillage, plus personne ne peut modifier
      - - responsable
        - n'agir que sur mon groupe
        - que chaque équipe reste séparée
        - une action sur un autre groupe est refusée par l'API
      - - équipe de Suitime
        - un back-office
        - suivre les utilisateurs, les groupes et les invitations
        - tableau de bord réservé à l'équipe
  - id: sy-choix-techniques
    rubrique: Les choix techniques
    titre: 'SYNCRO : les choix techniques'
    mots_cles: choix technique Flutter Next.js TypeScript MySQL MariaDB JWT jeton Nginx PM2 HTTPS Firebase APNs notifications serveur Linux déploiement Git
    tableau:
      entetes:
      - Besoin
      - Choix
      - Pourquoi
      lignes:
      - - Android et iOS
        - Flutter
        - Une seule base de code
      - - API REST
        - Next.js en TypeScript (53 routes, 14 modules)
        - Les erreurs se voient avant la mise en ligne plutôt qu'en production
      - - Données
        - MySQL / MariaDB, index et déclencheurs
        - Recherches rapides, données cohérentes
      - - Connexion
        - Jeton d'accès de 15 minutes, jeton de renouvellement de 7 jours
        - Un jeton volé ne sert pas longtemps
      - - Hébergement
        - Serveur Linux, Nginx, PM2, HTTPS
        - Reverse proxy, relance automatique de l'API, échanges chiffrés
      - - Déploiement
        - Par Git, avec suppression des vieux fichiers et test de connexion
        - Leçon de l'incident Apple
      - - Notifications
        - Firebase (Android), APNs (iOS)
        - Les services officiels de chaque plateforme
  - id: sy-incidents
    rubrique: Les incidents
    titre: 'SYNCRO : les incidents et leur résolution'
    mots_cles: incident bug panne App Store refus Apple connexion notifications iPhone créneaux minuit cloisonnement permissions cause correction prévention supervision
    tableau:
      entetes:
      - Incident
      - Cause
      - Correction
      - Pour que ça ne revienne pas
      lignes:
      - - 'Refus de l''App Store : connexion impossible'
        - Vieux fichiers restés sur le serveur après la migration en TypeScript ; cassé depuis 5 jours
        - Fichiers obsolètes supprimés
        - Déploiement qui nettoie et teste la connexion à chaque mise en ligne
      - - Double blocage sur un créneau
        - Protection fausse pour les horaires qui passent minuit
        - Nouvelle méthode de comparaison
        - Vérifiée sur les cent combinaisons possibles
      - - Notifications iPhone muettes
        - Trois écarts de configuration
        - Comparaison avec une autre application de l'entreprise qui marchait
        - Indicateur d'état dans l'application pour le prochain diagnostic
      - - Un responsable pouvait sortir de son groupe
        - Contrôle manquant sur une route sensible
        - Vérification du groupe côté API
        - Relecture des routes sensibles une par une
    paragraphes:
    - 'Le code de SYNCRO appartient à Suitime : il n''est pas publié ici.'
