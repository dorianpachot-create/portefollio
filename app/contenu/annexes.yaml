  - id: gc-code-sql
    rubrique: Le code
    titre: 'Venzy : extraits du script SQL'
    mots_cles: code SQL script CREATE TABLE clé primaire clé étrangère FOREIGN KEY ENUM DECIMAL CHECK InnoDB UNIQUE index NULL compte MySQL GRANT moindre privilège
    paragraphes:
    - Extraits recopiés du script de la base <code>gestion_courtage</code> (MySQL 8, 6 tables). Le script complet est dans les documents ci-dessus.
    code:
    - titre: 'La table affaire : le cœur du tunnel de vente'
      fichier: assets/annexes/venzy/schema-bdd-courtage.sql
      langage: sql
      texte: |-
        CREATE TABLE IF NOT EXISTS affaire (
            id_affaire INT UNSIGNED NOT NULL AUTO_INCREMENT,
            id_client INT UNSIGNED NOT NULL,
            id_produit INT UNSIGNED NULL,
            id_utilisateur INT UNSIGNED NOT NULL,  -- mandataire qui suit l'affaire
            etape ENUM('prospect', 'qualifie', 'devis_envoye', 'signe', 'perdu') NOT NULL DEFAULT 'prospect',
            besoin TEXT NULL,
            prime_mensuelle DECIMAL(10,2) NULL,    -- montant du devis
            date_devis DATE NULL,
            date_signature DATE NULL,
            numero_contrat VARCHAR(60) NULL,
            motif_perte VARCHAR(255) NULL,
            created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
            updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
            PRIMARY KEY (id_affaire),
            KEY idx_affaire_etape (etape),
            CONSTRAINT fk_affaire_client
              FOREIGN KEY (id_client) REFERENCES client(id_client),
            CONSTRAINT fk_affaire_produit
              FOREIGN KEY (id_produit) REFERENCES produit(id_produit),
            CONSTRAINT fk_affaire_utilisateur
              FOREIGN KEY (id_utilisateur) REFERENCES utilisateur(id_utilisateur),
            CONSTRAINT chk_affaire_prime CHECK (prime_mensuelle IS NULL OR prime_mensuelle >= 0)
        ) ENGINE=InnoDB;
    - titre: L'historique des étapes (qui, quand)
      fichier: assets/annexes/venzy/schema-bdd-courtage.sql
      langage: sql
      texte: |-
        CREATE TABLE IF NOT EXISTS historique_etape (
            id_historique INT UNSIGNED NOT NULL AUTO_INCREMENT,
            id_affaire INT UNSIGNED NOT NULL,
            id_utilisateur INT UNSIGNED NOT NULL,
            ancienne_etape ENUM('prospect', 'qualifie', 'devis_envoye', 'signe', 'perdu') NULL,
            nouvelle_etape ENUM('prospect', 'qualifie', 'devis_envoye', 'signe', 'perdu') NOT NULL,
            date_changement DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
            PRIMARY KEY (id_historique),
            KEY idx_historique_affaire (id_affaire, date_changement),
            CONSTRAINT fk_historique_affaire
              FOREIGN KEY (id_affaire) REFERENCES affaire(id_affaire),
            CONSTRAINT fk_historique_utilisateur
              FOREIGN KEY (id_utilisateur) REFERENCES utilisateur(id_utilisateur)
        ) ENGINE=InnoDB;
    - titre: 'Le produit : taux de commission contrôlé'
      fichier: assets/annexes/venzy/schema-bdd-courtage.sql
      langage: sql
      texte: |-
        CREATE TABLE IF NOT EXISTS produit (
            id_produit INT UNSIGNED NOT NULL AUTO_INCREMENT,
            id_compagnie INT UNSIGNED NOT NULL,
            libelle VARCHAR(160) NOT NULL,
            type_assurance VARCHAR(60) NOT NULL,
            -- Taux de commission en pourcentage de la prime : 12.50 signifie 12,5 %.
            taux_commission DECIMAL(5,2) NOT NULL DEFAULT 0.00,
            actif BOOLEAN NOT NULL DEFAULT TRUE,
            PRIMARY KEY (id_produit),
            UNIQUE KEY uq_produit_compagnie_libelle (id_compagnie, libelle),
            CONSTRAINT fk_produit_compagnie
              FOREIGN KEY (id_compagnie) REFERENCES compagnie(id_compagnie),
            CONSTRAINT chk_produit_taux CHECK (taux_commission >= 0 AND taux_commission <= 100)
        ) ENGINE=InnoDB;
    - titre: 'L''utilisateur : rôle, compte actif, e-mail unique'
      fichier: assets/annexes/venzy/schema-bdd-courtage.sql
      langage: sql
      texte: |-
        CREATE TABLE IF NOT EXISTS utilisateur (
            id_utilisateur INT UNSIGNED NOT NULL AUTO_INCREMENT,
            nom VARCHAR(100) NOT NULL,
            prenom VARCHAR(100) NOT NULL,
            email VARCHAR(254) NOT NULL,
            mot_de_passe_hash VARCHAR(255) NOT NULL,
            role ENUM('admin', 'user') NOT NULL DEFAULT 'user',
            actif BOOLEAN NOT NULL DEFAULT TRUE,
            created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
            updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
            PRIMARY KEY (id_utilisateur),
            UNIQUE KEY uq_utilisateur_email (email)
        ) ENGINE=InnoDB;
    - titre: 'Le compte MySQL de l''API : le moindre privilège'
      fichier: assets/annexes/venzy/schema-bdd-courtage.sql
      langage: sql
      texte: |-
        -- L'API ne peut que lire et modifier les données : elle ne peut ni créer ni supprimer de table.
        -- CREATE USER 'api_courtage'@'%' IDENTIFIED BY '<mot_de_passe>';
        -- GRANT SELECT, INSERT, UPDATE, DELETE ON gestion_courtage.* TO 'api_courtage'@'%';
    liste:
    - '<code>id_produit</code> accepte NULL : c''est le 0,1 du MCD, le produit est choisi au devis.'
    - '<code>DECIMAL</code> et pas <code>FLOAT</code> : des montants exacts. <code>ENUM</code> : une liste fermée d''étapes. <code>CHECK</code> : une prime jamais négative, un taux entre 0 et 100.'
    - 'Pas de <code>ON DELETE CASCADE</code> : impossible de supprimer un client qui a des affaires, l''historique est protégé.'
  - id: gc-code-requetes
    rubrique: Le code
    titre: 'Venzy : les requêtes des écrans'
    mots_cles: code SQL requête SELECT JOIN GROUP BY SUM COUNT transaction START TRANSACTION COMMIT requête préparée injection taux de transformation classement commission
    paragraphes:
    - 'Une requête par écran, testées sur un jeu de données fictives. Le <code>?</code> est rempli par l''API avec l''utilisateur du jeton : ce sont des requêtes préparées, contre l''injection SQL.'
    code:
    - titre: Mobile · Mes affaires
      langage: sql
      texte: |-
        SELECT c.nom, c.prenom, a.etape
        FROM affaire a
        JOIN client c ON c.id_client = a.id_client
        WHERE a.id_utilisateur = ?;
    - titre: Mobile · Mes chiffres (commissions estimées)
      langage: sql
      texte: |-
        SELECT SUM(a.prime_mensuelle * p.taux_commission / 100) AS commissions
        FROM affaire a
        JOIN produit p ON p.id_produit = a.id_produit
        WHERE a.id_utilisateur = ? AND a.etape = 'signe';
    - titre: Bureau · Tableau de bord
      langage: sql
      texte: |-
        SELECT etape, COUNT(*) AS nb FROM affaire GROUP BY etape;

        -- Taux de transformation : etape = 'signe' vaut 1 ou 0, SUM compte les signées
        SELECT ROUND(100 * SUM(etape = 'signe') / COUNT(*), 1) AS taux FROM affaire;
    - titre: Bureau · Classement des mandataires
      langage: sql
      texte: |-
        SELECT u.nom, u.prenom, COUNT(a.id_affaire) AS nb_signees,
               COALESCE(SUM(a.prime_mensuelle), 0) AS primes_signees
        FROM utilisateur u
        LEFT JOIN affaire a ON a.id_utilisateur = u.id_utilisateur
                           AND a.etape = 'signe'
        WHERE u.role = 'user'
        GROUP BY u.id_utilisateur, u.nom, u.prenom
        ORDER BY primes_signees DESC;
    - titre: Changer d'étape avec l'historique (transaction)
      langage: sql
      texte: |-
        START TRANSACTION;
        UPDATE affaire
           SET etape = 'signe', numero_contrat = ?, date_signature = ?
         WHERE id_affaire = ? AND etape = 'devis_envoye';
        INSERT INTO historique_etape (id_affaire, id_utilisateur, ancienne_etape, nouvelle_etape)
        VALUES (?, ?, 'devis_envoye', 'signe');
        COMMIT;  -- en cas d'erreur : ROLLBACK, rien n'est enregistré
