# ============================================================================
# LES ANNEXES (page pages/annexes.html)
# ----------------------------------------------------------------------------
# Les documents à montrer au jury, rangés par réalisation.
# Un bloc par groupe ; dans chaque groupe, une ligne par document :
#   titre        le nom du document
#   texte        une phrase pour dire ce qu'il contient
#   type         l'étiquette à gauche (PDF, Page, Image, PowerPoint, Lien)
#   url          le fichier ou la page (depuis la racine du site)
# Les comptes rendus de TP (contenu/cours.yaml) et les documents personnels
# (contenu/documents.yaml) sont ajoutés tout seuls en bas de la page.
# Pour ajouter une annexe : déposer le fichier dans assets/annexes/, puis
# copier une ligne ci-dessous.
# ============================================================================

groupes:
- id: e5
  titre: Épreuve E5
  documents:
  - titre: Tableau de synthèse
    texte: Mes réalisations face aux six compétences du bloc 1.
    type: PDF
    url: assets/annexes/tableau-de-synthese.pdf
  - titre: Présentation de l'oral
    texte: Les 15 diapositives, avec les notes de l'orateur.
    type: PowerPoint
    url: assets/presentation/Presentation_E5_Dorian_Pachot.pptx
  - titre: Mode présentation
    texte: Les mêmes diapositives dans le navigateur (touche P sur n'importe quelle page).
    type: Page
    url: pages/presentation.html

