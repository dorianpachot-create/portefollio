  - id: difficultes
    titre: Les difficultés et leurs solutions
    mots_cles: difficultés problèmes solutions bug liens relatifs PHP GitHub Pages apostrophe route conflit flash
    liste:
    - '<strong>GitHub Pages n''exécute pas de PHP</strong> : la commande app:export génère des pages HTML à partir de l''application Symfony.'
    - '<strong>Des liens qui marchent partout</strong> (en ligne comme en ouvrant le fichier) : la fonction Twig lien() calcule les liens relatifs.'
    - '<strong>Conflit de routes</strong> : /pages/stage.html était pris pour un projet « stage » ; priority: -1 sur la route des projets.'
    - '<strong>Flash sombre au chargement en mode clair</strong> : le thème est remis par un petit script placé dans le head, avant l''affichage.'
    - '<strong>YAML qui casse sur une apostrophe</strong> : la règle de l''apostrophe doublée, rappelée dans le guide.'
    - '<strong>Du HTML répété partout</strong> dans la première version : découpage en composants Twig.'
  - id: evolutions
    titre: Les évolutions possibles
    mots_cles: évolutions améliorations CI CD GitHub Actions intégration continue Tailwind polices
    liste:
    - '<strong>Intégration continue</strong> avec GitHub Actions : à chaque push, lancer app:export et les tests, et ne publier que si tout passe. C''est la suite logique de mon objectif DevOps.'
    - Compiler Tailwind au lieu de le charger depuis un CDN, et héberger les polices sur le site (plus rapide, et plus rien n'est envoyé à Google).
    - Une version anglaise du site.
    - Mettre en ligne la gestion de cabinet une fois développée (compétence « présence en ligne »).
