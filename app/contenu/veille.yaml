mise_a_jour: 23 octobre 2026
objectif:
  titre: Devenir DevOps, et un bon DevOps.
  texte: 'C''est le fil conducteur de ma veille. Je ne cherche pas seulement à connaître les outils : je veux comprendre comment on livre des applications fiables, sécurisées et faciles à maintenir, et savoir automatiser tout ce qui peut l''être. C''est pour cette raison que je vise un bachelor DevOps après le BTS.'
  etapes:
  - titre: Ce que je pratique déjà
    texte: Déploiements scriptés pour SYNCRO et Pla'Net, test automatique à chaque mise en ligne, serveurs Linux, scripts Bash, cron et systemd en TP.
  - titre: Ce que je prépare
    texte: 'Les certifications GitLab 101 et Terraform Associate : intégration continue et infrastructure décrite en code.'
  - titre: Ce que je veux maîtriser
    texte: Les chaînes CI/CD complètes, les conteneurs, la supervision et la sécurité intégrée dès la conception.
