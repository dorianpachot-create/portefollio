a_la_une:
  id: une
  rubrique: À la une, alerte de sécurité PHP
  titre: 'PHP2Shell : deux failles critiques dans PHP'
  chapeau: 'Le 20 octobre 2026, l''équipe de PHP a annoncé deux failles critiques (CVE-2026-109618 et CVE-2026-109619), corrigées en urgence le lendemain. Une simple requête HTTP, sans être connecté, peut suffire à exécuter du code sur le serveur.'
  pourquoi: 'Trois de mes projets tournent sur PHP : CRP-Assurance sur un hébergement mutualisé, Pla''Net en Symfony avec PHP-FPM, et ce portfolio, écrit en Symfony. Les modes touchés sont justement PHP-FPM et Apache avec mod_php, les plus courants.'
  retenu: 'La seule vraie parade est la mise à jour : versions 8.2.35, 8.3.36, 8.4.27 et 8.5.12. Les réglages d''attente (désactiver <code>session.upload_progress</code>, filtrer les envois de formulaires) ne suppriment pas le risque, et PHP 8.1 ou plus ancien n''a plus de correctif officiel. Sur un mutualisé comme celui de CRP-Assurance, c''est l''hébergeur qui corrige : mon rôle est de vérifier la version active et de choisir une branche encore suivie. Ce portfolio, lui, est publié en HTML : aucun PHP ne tourne en ligne. Enfin, les failles ont été trouvées avec l''aide de l''IA : les attaquants vont aussi vite que les défenseurs.'
  liens_avec: CRP-Assurance, Pla'Net, ce portfolio, cours de cybersécurité
