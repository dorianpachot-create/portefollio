  intro: "Application de gestion pour les cabinets de courtage en assurance et leurs mandataires : clients, contrats et commissions dans un seul outil, sur téléphone comme sur ordinateur. Le projet en est à la conception : le cahier des charges et le cahier technique sont rédigés, le développement commence."
